[project]
name = "owly-rag"
version = "1.1.0"
description = "Owly RAG — Local Document Q&A Workspace with Owly"
readme = "README.md"
authors = [{ name = "Rugved" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.34",
    "httpx>=0.28.1",
    "qdrant-client>=1.20.0",
    "bm25s>=0.3.16",
    "numpy>=2.0.0",
    "sentence-transformers>=6.3.0",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.11",
    "python-docx>=1.2.0",
    "pypdf>=7.1.1",
    "psutil>=7.2.2",
    "hf_transfer>=0.1.9",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "pyright>=1.1.414",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "pyright>=1.1.414",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["backend"]
typeCheckingMode = "basic"
